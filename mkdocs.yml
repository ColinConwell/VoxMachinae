site_name: Vox Machina
site_description: AI-assisted vocal modulation, orchestration, and synthesis
site_url: https://voxmachinae.dev

theme:
  name: material
  palette:
    - scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Outfit
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/colinconwell/VoxMachinae
repo_name: VoxMachinae

nav:
  - Home: index.md
  - Getting Started:
    - Installation: guides/installation.md
    - Quick Start: guides/quickstart.md
    - Web App: guides/webapp.md
  - API Reference:
    - Overview: api/index.md
    - Audio I/O: api/audio_io.md
    - Pitch Detection: api/pitch.md
    - Auto-Tune: api/autotune.md
    - Vocoder: api/vocoder.md
    - Effects: api/effects.md
    - Scales: api/scales.md
    - Stem Separation: api/separation.md
    - Denoising: api/denoise.md
    - Synthesis: api/synthesis.md
    - Presets: api/presets.md
  - DSP Glossary: reference/glossary.md
  - Architecture: reference/architecture.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            docstring_style: google

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/colinconwell/VoxMachinae
