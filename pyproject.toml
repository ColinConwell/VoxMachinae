[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxmachinae"
version = "0.1.0"
description = "AI-assisted vocal modulation and orchestration for music production"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sounddevice>=0.4",
    "pyworld>=0.3",
    "litellm>=1.0",
    "anthropic>=0.30",
    "httpx>=0.25",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]
audio-ml = [
    "demucs>=4.0",
    "noisereduce>=3.0",
    "deepfilternet>=0.5",
    "pyloudnorm>=0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["voxmachinae"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
